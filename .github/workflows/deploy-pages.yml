name: Deploy to GitHub Pages

# Every push to main builds vr-ball-game/, copies the other games, and publishes one Pages site:
#   /                  landing page (index.html)
#   /vr-ball-game/     built IWSDK app
#   /vr-ball-room-procedural/  built IWSDK app (asset-free variant)
#   /diggingahole/     single-file game
#   /fnaf-repair/      static game (ES modules, no build)
#   /boss-arena/       static game (ES modules, no build)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vr-ball-game/.nvmrc
          cache: npm
          cache-dependency-path: vr-ball-game/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: vr-ball-game
      - name: Typecheck
        run: npm run typecheck
        working-directory: vr-ball-game
      - name: Build
        run: npm run build
        working-directory: vr-ball-game
        env:
          NODE_ENV: production
      - name: Install (procedural)
        run: npm ci --no-audit --no-fund
        working-directory: vr-ball-room-procedural
      - name: Typecheck (procedural)
        run: npm run typecheck
        working-directory: vr-ball-room-procedural
      - name: Build (procedural)
        run: npm run build
        working-directory: vr-ball-room-procedural
        env:
          NODE_ENV: production
      - name: Assemble site
        run: |
          mkdir -p _site/vr-ball-game _site/vr-ball-room-procedural _site/diggingahole _site/fnaf-repair _site/boss-arena
          cp -r vr-ball-game/dist/. _site/vr-ball-game/
          cp -r vr-ball-room-procedural/dist/. _site/vr-ball-room-procedural/
          cp diggingahole/index.html _site/diggingahole/index.html
          cp -r fnaf-repair/index.html fnaf-repair/js fnaf-repair/lib fnaf-repair/models _site/fnaf-repair/
          cp -r boss-arena/index.html boss-arena/js boss-arena/lib boss-arena/models _site/boss-arena/
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
